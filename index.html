<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript_tutorial</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <!-- ヘッダー -->
        <nav>
            <div class="logo-area">
                <img src="./images/logo.png" alt="" class="logo">
                <h2>Electoric PC Design</h2>
            </div>
            <div class="nav-links">
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Detail</a></li>
                    <li><a href="">Shop</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </div>
        </nav>

        <!-- インフォメーション・セクション -->
        <div class="infomation">
            <div class="overlay"></div>
            <img src="./images/pc.png" alt="" class="pc">
            <div id="circle">
                <div class="feature one">
                    <img src="./images/camera.png" alt="">
                    <div>
                        <h1>Camera</h1>
                        <p>Beautiful lends.</p>
                    </div>
                </div>
                <div class="feature two">
                    <img src="./images/processor.png" alt="">
                    <div>
                        <h1>Processor</h1>
                        <p>Processor is very important.</p>
                    </div>
                </div>
                <div class="feature three">
                    <img src="./images/battery.png" alt="">
                    <div>
                        <h1>Battery</h1>
                        <p>Battery is powerful.</p>
                    </div>
                </div>
                <div class="feature four">
                    <img src="./images/display.png" alt="">
                    <div>
                        <h1>Display</h1>
                        <p>Beautiful display.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- コントロール・セクション -->
        <div class="control">
            <img src="./images/arrow.png" alt="" id="upBtn">
            <h3>Feature</h3>
            <img src="./images/arrow.png" alt="" id="downBtn">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
